<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#E9EDF0"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#1F6F8B"/>

  <!-- Top rule -->
  <line x1="48" y1="110" x2="1152" y2="110" stroke="#CBD5DB" stroke-width="1"/>

  <!-- Brand row -->
  <circle cx="52" cy="70" r="7" fill="#1F6F8B"/>
  <text x="72" y="76" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#6A7E89">BECHTEL × EDSTELLAR</text>

  <!-- Programme tag -->
  <rect x="48" y="130" width="188" height="28" rx="3" fill="#DCE9EE"/>
  <text x="142" y="149" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#1F6F8B" text-anchor="middle">APPLIED MLOPS</text>

  <!-- Headline -->
  <text x="48" y="252" font-family="Palatino,Georgia,serif" font-size="60" font-weight="600" fill="#12303F" letter-spacing="-1.2">Databricks and</text>
  <text x="48" y="326" font-family="Palatino,Georgia,serif" font-size="60" font-weight="600" fill="#12303F" letter-spacing="-1.2">Azure DevOps</text>

  <!-- Subline -->
  <text x="48" y="382" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="21" fill="#3D5663">Calibration, not examination. No pass mark, no ranking.</text>

  <!-- Pill tags -->
  <rect x="48" y="432" width="188" height="36" rx="4" fill="#DCE9EE"/>
  <text x="142" y="455" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1F6F8B" text-anchor="middle">Pre &amp; post assessment</text>

  <rect x="248" y="432" width="132" height="36" rx="4" fill="#DCE9EE"/>
  <text x="314" y="455" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1F6F8B" text-anchor="middle">8 stages</text>

  <rect x="392" y="432" width="150" height="36" rx="4" fill="#DCE9EE"/>
  <text x="467" y="455" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1F6F8B" text-anchor="middle">D1–D5 + LLM</text>

  <!-- Bottom rule + footer -->
  <line x1="48" y1="536" x2="1152" y2="536" stroke="#CBD5DB" stroke-width="1"/>
  <text x="48" y="572" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#6A7E89">Edstellar · confidential</text>
</svg>
